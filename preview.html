<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Race Display Preview</title>
<script type="module" src="https://unpkg.com/@google/model-viewer@3.5.0/dist/model-viewer.min.js"></script>
<style>
  :root { --bg:#f4f3ef; --ink:#1d1d1f; --muted:#6b6b70; --card:#fff; --line:#d9d7d0; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg:#141416; --ink:#ececef; --muted:#9a9aa2; --card:#1e1e21; --line:#34343a; } }
  :root[data-theme="dark"] { --bg:#141416; --ink:#ececef; --muted:#9a9aa2; --card:#1e1e21; --line:#34343a; }
  body { margin:0; background:var(--bg); color:var(--ink); font:15px/1.5 system-ui, sans-serif; }
  main { max-width:1100px; margin:0 auto; padding:20px 16px; }
  h1 { font-size:22px; margin:0 0 4px; } p { color:var(--muted); margin:0 0 12px; }
  model-viewer { width:100%; height:78vh; background:#e9e6df; border-radius:10px; border:1px solid var(--line); }
  .btns button { margin:0 6px 10px 0; padding:6px 10px; border-radius:6px; border:1px solid var(--line); background:var(--card); color:var(--ink); cursor:pointer; }
</style>
</head>
<body>
<main>
  <h1>Race Display: CAD preview</h1>
  <p>This is out/preview/assembly.glb as generated by models/race_display.py. Drag to orbit, scroll to zoom.</p>
  <div class="btns">
    <button data-o="0deg 90deg auto">Front</button>
    <button data-o="35deg 70deg auto">Angled</button>
    <button data-o="180deg 90deg auto">Back (keyholes)</button>
    <button data-o="90deg 95deg auto">Side</button>
    <button data-o="20deg 150deg auto">From below (joints)</button>
  </div>
  <model-viewer id="mv" src="out/preview/assembly.glb" camera-controls camera-orbit="0deg 90deg auto" exposure="1.1" shadow-intensity="0.6" interaction-prompt="none"></model-viewer>
</main>
<script>
  const mv = document.getElementById('mv');
  document.querySelectorAll('[data-o]').forEach(b => b.onclick = () => { mv.cameraOrbit = b.dataset.o; });
</script>
</body>
</html>
